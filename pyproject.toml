[project]
name = "ai-pictionary"
version = "1.0.0"
description = "Real-time finger drawing and asynchronous AI drawing recognition"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8,<5.0",
    "mediapipe<=0.10.14",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "open-clip-torch>=2.26,<3.0",
]

[tool.uv]
package = false
